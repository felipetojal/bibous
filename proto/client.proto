syntax = "proto3";

// Contrato entre o cliente (CLI) e o mestre.
//
// O mestre só coordena: o conteúdo dos arquivos nunca passa por ele.
// O cliente divide o arquivo em blocos, pede ao mestre onde gravar cada
// bloco e envia os bytes diretamente aos nós (StorageService.PutBlock).
// No download o cliente pede a localização dos blocos e lê direto dos nós
// (StorageService.GetBlock).
//
// Fluxo de upload:
//   1. Cliente divide o arquivo e calcula o SHA-256 de cada bloco.
//   2. PrepareUpload  -> mestre devolve block_id/version e réplicas de cada bloco.
//   3. Cliente envia cada bloco a cada réplica com StorageService.PutBlock.
//   4. CommitUpload   -> cliente informa quais réplicas confirmaram cada bloco;
//                        só então o arquivo passa a existir para o mestre.
//
// Fluxo de download:
//   1. GetFile        -> mestre devolve os blocos e as réplicas de cada um.
//   2. Cliente lê cada bloco de alguma réplica, confere o hash e monta o arquivo.

package client.v1;

// Gerado no mesmo diretório/pacote Go do storage.proto (storagepb).
// Por isso os nomes das mensagens não podem repetir os do storage.proto.
option go_package = "github.com/felipetojal/bibous/api/storage/v1;storagepb";

service ClientService {
  rpc PrepareUpload(PrepareUploadRequest) returns (PrepareUploadResponse);
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // Renomeia ou move um arquivo ou diretório (só metadados).
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc MakeDir(MakeDirRequest) returns (MakeDirResponse);
  // Remove um diretório; falha se não estiver vazio, salvo recursive=true.
  rpc RemoveDir(RemoveDirRequest) returns (RemoveDirResponse);
  rpc ReportCorruption(ReportCorruptionRequest) returns (ReportCorruptionResponse);
}

// Estado de replicação/integridade de um arquivo (RF1).
enum FileState {
  FILE_STATE_UNSPECIFIED = 0;
  FILE_STATE_HEALTHY = 1;          // íntegro: todos os blocos com N réplicas
  FILE_STATE_UNDER_REPLICATED = 2; // algum bloco com menos de N réplicas vivas
  FILE_STATE_RECOVERING = 3;       // re-replicação em andamento
}

// Nó de armazenamento que deve receber (ou que possui) um bloco.
message NodeLocation {
  string node_id = 1;
  string address = 2; // host:porta do StorageService
}

// Bloco como o cliente o calculou, antes de o mestre conhecê-lo.
message BlockSpec {
  uint32 index = 1; // posição no arquivo, a partir de 0
  int64 size = 2;   // bytes; todos têm block_size, exceto o último
  string hash = 3;  // SHA-256 hexadecimal do conteúdo
}

// Bloco com a identidade atribuída pelo mestre e onde ele está.
message BlockLocation {
  uint32 index = 1;
  string block_id = 2; // [a-zA-Z0-9_-]{1,128}, exigido pelo storage
  int64 version = 3;   // >= 1
  int64 size = 4;
  string hash = 5;
  repeated NodeLocation replicas = 6;
}

message PrepareUploadRequest {
  string path = 1;      // caminho no sistema, ex.: /docs/relatorio.pdf
  int64 size = 2;       // tamanho total do arquivo
  string hash = 3;      // SHA-256 do arquivo inteiro
  int64 block_size = 4; // tamanho usado na divisão (<= 4 MiB)
  uint32 replication_factor = 5; // 0 = padrão do mestre
  repeated BlockSpec blocks = 6;
  bool overwrite = 7;   // substituir se o caminho já existir
}

message PrepareUploadResponse {
  string upload_id = 1;
  // Um item por bloco de PrepareUploadRequest.blocks, mesmo index.
  repeated BlockLocation blocks = 2;
}

// Réplicas que confirmaram (PutResponse válido) um bloco.
message StoredBlock {
  string block_id = 1;
  int64 version = 2;
  repeated string node_ids = 3;
}

message CommitUploadRequest {
  string upload_id = 1;
  repeated StoredBlock blocks = 2;
}

message CommitUploadResponse {
  FileInfo file = 1;
}

message GetFileRequest {
  string path = 1;
}

message GetFileResponse {
  FileInfo file = 1;
  repeated BlockLocation blocks = 2; // ordenados por index
}

message FileInfo {
  string path = 1;
  int64 size = 2;
  string hash = 3;
  uint32 replication_factor = 4;
  uint32 block_count = 5;
  int64 created_at_unix = 6;
  int64 updated_at_unix = 7;
  bool is_dir = 8;          // true para diretórios (ListFiles)
  FileState state = 9;      // só para arquivos
}

// Lista o conteúdo imediato de um diretório (arquivos e subdiretórios).
message ListFilesRequest {
  string prefix = 1; // diretório a listar; vazio ou "/" = raiz
}

message ListFilesResponse {
  repeated FileInfo files = 1;
}

message DeleteFileRequest {
  string path = 1;
}

message DeleteFileResponse {
  bool deleted = 1;
}

message MoveRequest {
  string from = 1;
  string to = 2;
  bool overwrite = 3;
}

message MoveResponse {
  FileInfo file = 1;
}

message MakeDirRequest {
  string path = 1;
  bool parents = 2; // cria diretórios intermediários (como mkdir -p)
}

message MakeDirResponse {
  FileInfo dir = 1;
}

message RemoveDirRequest {
  string path = 1;
  bool recursive = 2;
}

message RemoveDirResponse {
  bool deleted = 1;
}

message ReportCorruptionRequest {
  string block_id = 1;
  string node_id = 2; // O nó que entregou o dado com hash incorreto
}

message ReportCorruptionResponse {}
