syntax = "proto3";

package storage.v1;

option go_package = "github.com/felipetojal/bibous/api/storage/v1;storagepb";

service StorageService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc PutBlock(PutRequest) returns (PutResponse);
  rpc GetBlock(GetRequest) returns (GetResponse);
}

message HeartbeatRequest {
  uint64 nonce = 1;
}

message HeartbeatResponse {
  string node_id = 1;
  uint64 nonce = 2;
}

message PutRequest {
  string operation_id = 1;
  string block_id = 2;
  int64 version = 3;
  int64 size = 4;
  string hash = 5;
  bytes data = 6;
}

message PutResponse {
  string node_id = 1;
  string block_id = 2;
  int64 version = 3;
  int64 size = 4;
  string hash = 5;
}

message GetRequest {
  string block_id = 1;
  int64 version = 2;
}

message GetResponse {
  string block_id = 1;
  int64 version = 2;
  int64 size = 3;
  string hash = 4;
  bytes data = 5;
}
